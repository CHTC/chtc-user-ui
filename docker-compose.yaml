services:
  setup:
    image: "python:3.12-slim"
    volumes:
      - .:/app
    working_dir: /app
    command: python scripts/dev/generate_tokens.py
    env_file:
      - .

  nginx:
    build:
      context: ./scripts/dev
      dockerfile: nginx.Dockerfile
    ports:
      - "80:80"
    env_file:
      - dev.env
